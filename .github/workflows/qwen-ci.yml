name: Qwen Coder Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install openai pytest flake8
      - name: Lint and syntax check
        run: |
          python -m py_compile qwen_coder_agent.py
          flake8 qwen_coder_agent.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 qwen_coder_agent.py --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      - name: Validate scripts
        run: |
          bash scripts/validate.sh --dry-run
